[project]
name = "agenda"
version = "0.1.0"
description = "DigitalAgenda v1: bot de Discord que ofrece y registra"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
